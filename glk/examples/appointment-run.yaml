        target: GO-PUBLISH
        justification: "Authorization edge was reachable but not incident-confirmed"
        source_claim_or_output_refs: ["GO-AUTH.authorization-output"]
        target_input_or_assumption_refs: ["GO-PUBLISH.authorization-input"]
        consumption_evidence_refs: ["evidence/edges/GO-AUTH-GO-PUBLISH.json"]
    stopping_reason: "confirmed source reached"
