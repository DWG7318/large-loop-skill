      - "evidence/incidents/INCIDENT-APPOINTMENT-001/schedule-publish.json"
      - "evidence/incidents/INCIDENT-APPOINTMENT-001/publish-audit.json"
    symptom_go_ids: [GO-AUDIT]
    causal_path:
      - source: GO-SCHEDULE
        target: GO-PUBLISH
        justification: "Incident evidence confirms schedule output consumption"
        source_claim_or_output_refs: ["GO-SCHEDULE.schedule-output"]
        target_input_or_assumption_refs: ["GO-PUBLISH.schedule-input"]
        consumption_evidence_refs: ["evidence/edges/GO-SCHEDULE-GO-PUBLISH.json"]
        incident_evidence_refs: ["evidence/incidents/INCIDENT-APPOINTMENT-001/schedule-publish.json"]
